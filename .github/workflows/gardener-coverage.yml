name: Gardener Coverage Gate

on:
  push:
    paths:
      - 'tools/gardener/**'
      - 'scripts/**'
      - '.github/workflows/gardener-coverage.yml'
  pull_request:
    paths:
      - 'tools/gardener/**'
      - 'scripts/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-llvm-cov --locked
      - name: Run coverage gate and generate reports
        id: run-coverage
        env:
          COVERAGE_LCOV_FILE: coverage-artifacts/lcov.info
          COVERAGE_HTML_DIR: coverage-artifacts/html
        run: ./scripts/test-gardener-coverage.sh
      - name: Upload coverage reports
        id: upload-coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gardener-coverage-${{ github.sha }}
          path: coverage-artifacts
          if-no-files-found: error
          retention-days: 14
      - name: Publish coverage links in workflow summary
        if: always()
        run: |
          {
            echo "## Coverage artifacts"
            echo ""
            echo "- LCOV and HTML coverage reports were generated from this run."
            echo "- View all run artifacts: [Coverage artifacts](${GITHUB_SERVER_URL}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)"
            if [[ -n "${{ steps.upload-coverage.outputs.artifact-url }}" ]]; then
              echo "- [Direct artifact link](${{ steps.upload-coverage.outputs.artifact-url }})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
